<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TODO アプリ 練習</title> 
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --text: #1f2430;
    --muted: #8a92a6;
    --border: #e3e6ec;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --danger: #ef4444;
    --done: #a0a7b8;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171c;
      --panel: #1e2128;
      --text: #e7e9ee;
      --muted: #7c8496;
      --border: #2c313b;
      --accent: #4b8ef7;
      --accent-hover: #6aa3f8;
      --danger: #f26d6d;
      --done: #5b6373;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN",
                 "Yu Gothic", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 48px 16px;
    line-height: 1.6;
  }

  .app {
    width: 100%;
    max-width: 520px;
    background: var(--panel);
    border-radius: 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  header {
    padding: 28px 28px 20px;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    font-size: 1.4rem;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  header p {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 4px;
  }

  .input-row {
    display: flex;
    gap: 10px;
    padding: 20px 28px;
  }

  #new-task {
    flex: 1;
    padding: 12px 14px;
    font-size: 0.95rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  #new-task:focus { border-color: var(--accent); }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
  }

  #add-btn {
    padding: 12px 20px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    transition: background 0.15s;
  }
  #add-btn:hover { background: var(--accent-hover); }

  .filters {
    display: flex;
    gap: 8px;
    padding: 0 28px 16px;
  }

  .filters button {
    padding: 6px 14px;
    background: transparent;
    color: var(--muted);
    font-size: 0.82rem;
    border: 1px solid var(--border);
  }
  .filters button.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  ul#list {
    list-style: none;
    max-height: 45vh;
    overflow-y: auto;
  }

  li.task {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 28px;
    border-top: 1px solid var(--border);
  }
  li.task:first-child { border-top: none; }

  li.task input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }

  li.task .title {
    flex: 1;
    font-size: 0.95rem;
    word-break: break-word;
    cursor: text;
  }
  li.task.done .title {
    text-decoration: line-through;
    color: var(--done);
  }

  li.task .title-edit {
    flex: 1;
    font: inherit;
    font-size: 0.95rem;
    padding: 4px 6px;
    border: 1px solid var(--accent);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    outline: none;
  }

  li.task .del {
    background: transparent;
    color: var(--muted);
    font-size: 1.1rem;
    padding: 4px 8px;
    line-height: 1;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
  }
  li.task:hover .del { opacity: 1; }
  li.task .del:hover { color: var(--danger); }

  .empty {
    padding: 40px 28px;
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
  }

  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 28px;
    border-top: 1px solid var(--border);
    font-size: 0.82rem;
    color: var(--muted);
  }

  footer button {
    background: transparent;
    color: var(--muted);
    font-size: 0.82rem;
    padding: 4px 0;
  }
  footer button:hover { color: var(--danger); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>📝 TODO リスト</h1>
    <p>ダブルクリックで編集・Enter で保存。データはこのブラウザに保存されます。</p>
  </header>

  <div class="input-row">
    <input type="text" id="new-task" placeholder="やることを入力..." autocomplete="off" maxlength="200">
    <button id="add-btn">追加</button>
  </div>

  <div class="filters">
    <button data-filter="all" class="active">すべて</button>
    <button data-filter="active">未完了</button>
    <button data-filter="done">完了</button>
  </div>

  <ul id="list"></ul>

  <footer>
    <span id="count">0 件</span>
    <button id="clear-done">完了済みを削除</button>
  </footer>
</div>

<script>
(function () {
  "use strict";

  const STORAGE_KEY = "todo-app.tasks.v1";
  const listEl = document.getElementById("list");
  const inputEl = document.getElementById("new-task");
  const addBtn = document.getElementById("add-btn");
  const countEl = document.getElementById("count");
  const clearDoneBtn = document.getElementById("clear-done");
  const filterBtns = Array.from(document.querySelectorAll(".filters button"));

  let tasks = load();
  let filter = "all";

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    } catch (e) {
      /* ストレージ不可でも動作は継続 */
    }
  }

  function addTask(title) {
    const text = title.trim();
    if (!text) return;
    tasks.unshift({ id: Date.now() + "-" + Math.random().toString(36).slice(2, 8), title: text, done: false });
    save();
    render();
  }

  function toggleTask(id) {
    const t = tasks.find(t => t.id === id);
    if (t) { t.done = !t.done; save(); render(); }
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    save();
    render();
  }

  function editTask(id, title) {
    const t = tasks.find(t => t.id === id);
    if (!t) return;
    const text = title.trim();
    if (text) { t.title = text; save(); }
    render();
  }

  function clearDone() {
    tasks = tasks.filter(t => !t.done);
    save();
    render();
  }

  function visibleTasks() {
    if (filter === "active") return tasks.filter(t => !t.done);
    if (filter === "done") return tasks.filter(t => t.done);
    return tasks;
  }

  function render() {
    listEl.innerHTML = "";
    const visible = visibleTasks();

    if (visible.length === 0) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = tasks.length === 0 ? "タスクはありません 🎉" : "この条件に一致するタスクはありません";
      listEl.appendChild(li);
    }

    for (const task of visible) {
      const li = document.createElement("li");
      li.className = "task" + (task.done ? " done" : "");

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = task.done;
      cb.addEventListener("change", () => toggleTask(task.id));

      const title = document.createElement("span");
      title.className = "title";
      title.textContent = task.title;
      title.addEventListener("dblclick", () => startEdit(li, task));

      const del = document.createElement("button");
      del.className = "del";
      del.setAttribute("aria-label", "削除");
      del.textContent = "×";
      del.addEventListener("click", () => deleteTask(task.id));

      li.append(cb, title, del);
      listEl.appendChild(li);
    }

    const remaining = tasks.filter(t => !t.done).length;
    countEl.textContent = `未完了 ${remaining} 件 / 全 ${tasks.length} 件`;
  }

  function startEdit(li, task) {
    const input = document.createElement("input");
    input.type = "text";
    input.className = "title-edit";
    input.value = task.title;
    input.maxLength = 200;

    const titleEl = li.querySelector(".title");
    li.replaceChild(input, titleEl);
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);

    let finished = false;
    const commit = () => { if (finished) return; finished = true; editTask(task.id, input.value); };
    const cancel = () => { if (finished) return; finished = true; render(); };

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") commit();
      else if (e.key === "Escape") cancel();
    });
    input.addEventListener("blur", commit);
  }

  addBtn.addEventListener("click", () => { addTask(inputEl.value); inputEl.value = ""; inputEl.focus(); });
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { addTask(inputEl.value); inputEl.value = ""; }
  });
  clearDoneBtn.addEventListener("click", clearDone);

  filterBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      filter = btn.dataset.filter;
      filterBtns.forEach(b => b.classList.toggle("active", b === btn));
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
